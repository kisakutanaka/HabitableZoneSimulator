<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ハビタブルゾーンシミュレータ</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="info-panel">
      <div id="temperature-display">
        <div id="temperature-value"></div>
        <div id="temperature-comment"></div>
      </div>
      <div id="legend">
        <span class="legend-item"><span class="swatch swatch-hz"></span>ハビタブルゾーン（水が液体でいられる範囲）</span>
      </div>
    </div>
    <div id="controls">
      <div class="control">
        <label for="star-mass">
          恒星の質量 — 重いほど明るく高温になり、ハビタブルゾーンも外側に広がる
        </label>
        <div class="slider-row">
          <input id="star-mass" type="range" min="0.5" max="1.5" step="0.01" value="1.0" />
          <span id="star-mass-value" class="slider-value"></span>
        </div>
        <p id="star-readout" class="readout"></p>
      </div>
      <div class="control">
        <label for="earth-distance">
          地球の公転半径 — 恒星に近すぎると暑く、遠すぎると寒くなる
        </label>
        <div class="slider-row">
          <input id="earth-distance" type="range" min="0.5" max="2.5" step="0.01" value="1.0" />
          <span id="earth-distance-value" class="slider-value"></span>
        </div>
        <p id="earth-readout" class="readout"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
