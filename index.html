<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ハビタブルゾーンシミュレータ</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="legend">
      <span class="legend-item"><span class="swatch swatch-hz"></span>ハビタブルゾーン（水が液体でいられる範囲）</span>
    </div>
    <div id="controls">
      <div class="control">
        <label for="star-mass">
          恒星の質量（太陽 = 1.0）— 重いほど明るく高温になり、ハビタブルゾーンも外側に広がる
        </label>
        <input id="star-mass" type="range" min="0.5" max="1.5" step="0.01" value="1.0" />
        <p id="star-readout" class="readout"></p>
      </div>
      <div class="control">
        <label for="earth-distance">
          地球の公転半径（AU）— 恒星に近すぎると暑く、遠すぎると寒くなる
        </label>
        <input id="earth-distance" type="range" min="0.5" max="2.5" step="0.01" value="1.0" />
        <p id="earth-readout" class="readout"></p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
